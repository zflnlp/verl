hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

custom_reward_function:
  path: examples/alfworld_grpo/reward_function.py
  name: compute_score

data:
  max_prompt_length: 10240
  max_response_length: 6144
  train_batch_size: 32
  return_raw_chat: True
  filter_overlong_prompts: True
  truncation: 'error'

actor_rollout_ref:
  hybrid_engine: True
  model:
    use_remove_padding: True
    enable_gradient_checkpointing: True
  actor:
    optim:
      lr: 1e-6
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 8
    use_dynamic_bsz: True
    use_kl_loss: True
    kl_loss_coef: 1.0
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    fsdp_config:
      param_offload: False
      optimizer_offload: False
  rollout:
    name: sglang
    tensor_model_parallel_size: 2
    gpu_memory_utilization: 0.7
    n: 4
    log_prob_micro_batch_size_per_gpu: 8
    multi_turn:
      enable: True
      max_assistant_turns: 30
      max_user_turns: 1
      tool_config_path: "examples/alfworld_grpo/config/alfworld_tool_config.yaml"
      interaction_config_path: "examples/alfworld_grpo/config/alfworld_interaction_config.yaml"
  ref:
    log_prob_micro_batch_size_per_gpu: 8
    fsdp_config:
      param_offload: True

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: False

trainer:
  critic_warmup: 0
  logger: ['console']
  n_gpus_per_node: 1
  nnodes: 1
  save_freq: 5
  test_freq: 2
  total_epochs: 1
  val_before_train: False
