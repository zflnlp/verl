# ScienceWorld multi-turn GRPO config for verl main
#
# Uses the new agent_loop architecture with custom ScienceWorldAgentLoop.
# Compatible with latest verl (CUDA 13.1).

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  max_prompt_length: 10240
  max_response_length: 8192
  train_batch_size: 64
  return_raw_chat: True
  filter_overlong_prompts: True

actor_rollout_ref:
  hybrid_engine: True
  model:
    use_remove_padding: True
    enable_gradient_checkpointing: True
  actor:
    optim:
      lr: 1e-6
      grad_clip: 1.0
    ppo_mini_batch_size: 64
    ppo_micro_batch_size_per_gpu: 8
    use_dynamic_bsz: True
    use_kl_loss: True
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
  rollout:
    name: vllm
    gpu_memory_utilization: 0.7
    n: 4
    max_num_batched_tokens: 20480
    multi_turn:
      enable: true
      max_assistant_turns: 30
      format: hermes
    agent:
      default_agent_loop: scienceworld_agent
      agent_loop_config_path: null
  ref:
    fsdp_config:
      param_offload: True

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: False

trainer:
  critic_warmup: 0
  logger: ['console']
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 250
  test_freq: 5
  total_epochs: 1
  val_before_train: False
  seed: 42
